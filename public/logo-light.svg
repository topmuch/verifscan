<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" role="img" aria-label="VerifScan">
  <!--
    Logo VerifScan — version claire pour fonds sombres (sidebar dashboard #124685).
    Composition :
      - Bouclier stylisé vert #2ebd5a avec coche de vérification blanche
      - Wordmark "VerifScan" en blanc, "Verif" en gras + "Scan" en régulier
    Le symbole bouclier + coche évoque la traçabilité, l'authenticité et la sécurité.
  -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ed471"/>
      <stop offset="100%" stop-color="#2ebd5a"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Bouclier arrondi -->
  <g filter="url(#dropShadow)">
    <path d="M 28 8 L 48 16 L 48 36 C 48 52 38 64 28 70 C 18 64 8 52 8 36 L 8 16 Z"
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Coche de vérification -->
    <path d="M 19 36 L 26 44 L 39 26"
          fill="none" stroke="#ffffff" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="64" y="40" font-family="Poppins, Inter, system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Verif</text>
  <text x="138" y="40" font-family="Poppins, Inter, system-ui, sans-serif"
        font-size="28" font-weight="400" fill="#ffffff" letter-spacing="-0.5">Scan</text>

  <!-- Sous-titre / baseline -->
  <text x="64" y="58" font-family="Inter, system-ui, sans-serif"
        font-size="9" font-weight="500" fill="#9ec7f0" letter-spacing="2.4">TRACABILITÉ &amp; AUTHENTICITÉ</text>
</svg>
